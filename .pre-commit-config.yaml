---
files: ^(.*\.(py|json|md|sh|yaml|yml|cfg|txt))$
exclude: ^(\.[^/]*cache/.*|demo/.*|debug/.*)$
repos:
  # Disable because this does not work for the main author.
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: "v2.7.1"
  #   stages: [manual]
  #   hooks:
  #     - id: prettier
  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # 1.0.0
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat  # Executable to run, with fixed options
        language: python
        types: [markdown]
        args: [--wrap, "75", --number]
        # files: ^HomeAssistant.md$
        additional_dependencies:
          - mdformat-toc
          - mdformat-beautysh
          - mdformat-config
          - mdformat-gfm
          - setuptools==83.0.0
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
        # Exclude because of bug in checker
        exclude: ^(docker-compose\.yml|.*/release-drafter\.yml)$
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^(.*\.md)$
      - id: check-json
      - id: mixed-line-ending
      - id: check-builtin-literals
      - id: check-ast
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: pretty-format-json
        exclude: ^(.vscode|.devcontainer)
        args:
          # order of keys in manifest.json is "special"
          - --no-sort-keys
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: ffb6a759a979008c0e6dff86e39f4745a2d9eac4  # v3.1.0
    hooks:
      - id: prettier
  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0
    hooks:
      - id: yamllint
        args:
          - --no-warnings
          - -d
          - "{extends: relaxed, rules: {line-length: {max: 90}}}"
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # 26.5.1
    hooks:
      - id: black
        args:
          - --safe
          - --quiet
          - -l 79
  - repo: https://github.com/Lucas-C/pre-commit-hooks-bandit
    rev: be256dab724687e8c3d7d6f52c1b263e2de6d439  # v1.0.6
    hooks:
      - id: python-bandit-vulnerability-check
        args: [--skip, "B105,B110,B311,B404,B603", --recursive, apps]
  - repo: https://github.com/fsouza/autoflake8
    rev: c1d5e997827b2b52225adf965bbf3cd545465d1e  # v0.4.1
    hooks:
      - id: autoflake8
        args:
          - -i
          - -r
          - --expand-star-imports
          - .
  - repo: https://github.com/PyCQA/flake8
    rev: d93590f5be797aabb60e3b09f2f52dddb02f349f  # 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          # - pyproject-flake8>=7.0.0  # force in hook
          - flake8-bugbear>=25.11.29
          - flake8-comprehensions>=3.17.0
          - flake8_2020>=1.8.1
          - mccabe
          - pycodestyle>=2.14.0
          - pyflakes>=3.4.0
  - repo: https://github.com/PyCQA/isort
    rev: a333737ed43df02b18e6c95477ea1b285b3de15a  # 8.0.1
    hooks:
      - id: isort
  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a  # v2.4.2
    hooks:
      - id: codespell
        exclude: (\.md|apps.yaml|translations/.*.yaml)$
  - repo: https://github.com/pylint-dev/pylint
    rev: 8a396357098337ba8be714fffdf2d00947a9778c  # v4.0.6
    hooks:
      - id: pylint
        # exclude: ^$
        additional_dependencies:
          - hassapi
          - pyflakes
          - paho-mqtt
          - aiohttp
          - regex
          - pyperclip
        args:
          - --reports=no
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 41e691678310dfd3833f7ab4e180ddb014310356  # v2.3.0
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
          - --check-untyped-defs
          - --show-error-codes
          - --show-error-context
        additional_dependencies:
          - paho-mqtt
          - types-requests
          - urllib3
          - regex
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: f626253b23de45412865c07fd076ff95d4cd77a7  # v3.0.1
    hooks:
      - id: docker-compose-check
  - repo: https://github.com/lovesegfault/beautysh.git
    rev: 885128fe2600889194c69fa19326cf55a3462777  # v6.4.3
    hooks:
      - id: beautysh
        exclude: (run.sh)$
        # additional_dependencies:
        #   - setuptools
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^[^\.].*\.sh$
        args: [--shell, bash]
