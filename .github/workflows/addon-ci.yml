---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  workflows:
    uses: hassio-addons/workflows/.github/workflows/addon-ci.yaml@main
    image: "ghcr.io/mdeweerd/MetersToHA"
    registry-username: ${{ secrets.DOCKER_HUB_USERNAME }}
    registry-password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
